services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: cinebridge
      POSTGRES_PASSWORD: cinebridge
      POSTGRES_DB: cinebridge
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - cinebridge_pg:/var/lib/postgresql
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinebridge -d cinebridge"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  cinebridge_pg:
